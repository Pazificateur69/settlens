# settlens.com — product site + MCP endpoint (container settlens-site on 127.0.0.1:3318)
# Source: site/nginx/settlens.conf in the settlens repo. Previous services site: /opt/settlens-web (container stopped, kept for rollback).
limit_req_zone $binary_remote_addr zone=settlens_pilot:1m rate=3r/m;
limit_req_zone $binary_remote_addr zone=settlens_mcp:2m rate=60r/m;
limit_req_zone $binary_remote_addr zone=settlens_api:1m rate=30r/m;

server {
    listen 192.0.2.10:80;
    server_name settlens.com www.settlens.com;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/settlens-web/acme-webroot;
    }
    location / { return 301 https://settlens.com$request_uri; }
}

server {
    listen 192.0.2.10:443 ssl;
    http2 on;
    server_name settlens.com www.settlens.com;
    ssl_certificate /opt/settlens-web/letsencrypt/live/settlens.com/fullchain.pem;
    ssl_certificate_key /opt/settlens-web/letsencrypt/live/settlens.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/settlens.error.log warn;

    # All security headers (HSTS included) and Speculation-Rules come from the Node server: do not add them here.

    # Dynamic responses (/mcp, /api/*) are compressed here. Pages and files are not: the Node server sends the
    # build's precompressed br/gzip copies with Vary: Accept-Encoding (location / below turns gzip off). Never set
    # proxy_set_header Accept-Encoding "": the server would then only send identity bodies.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json application/xml application/rss+xml text/xml image/svg+xml text/plain;

    client_max_body_size 64k;

    if ($host = www.settlens.com) { return 301 https://settlens.com$request_uri; }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    # Overwrite (never append): the app trusts the last X-Forwarded-For entry.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";

    location = /api/pilot {
        limit_req zone=settlens_pilot burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3318;
        proxy_read_timeout 20s;
    }

    location = /api/scan {
        limit_req zone=settlens_api burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3318;
        proxy_read_timeout 40s;
    }

    location ^~ /api/monitor/ {
        limit_req zone=settlens_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3318;
        proxy_read_timeout 350s;
    }

    location = /mcp {
        limit_req zone=settlens_mcp burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 300k;
        proxy_pass http://127.0.0.1:3318;
        proxy_read_timeout 40s;
    }

    location / {
        # Already compressed by the server (br or gzip); recompressing would also weaken its ETags.
        gzip off;
        proxy_pass http://127.0.0.1:3318;
        proxy_read_timeout 30s;
    }
}
